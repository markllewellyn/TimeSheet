<div class="mx-auto flex min-h-[60vh] max-w-md flex-col justify-center text-center">
  <h1 class="page-title mb-4">Welcome to TimeSheet</h1>
  <p class="mb-6 text-sm text-muted-foreground">
    This database doesn't have any users yet. Claim admin access to get started - you'll be able to invite
    everyone else from the Users screen afterwards.
  </p>

  @if (error(); as e) {
    <div class="banner-error">{{ e }}</div>
  }

  <button class="btn-primary mx-auto" [disabled]="working()" (click)="claimAdmin()">
    Claim Admin Access
  </button>
</div>
