<div class="auth-backdrop -m-6 flex min-h-[calc(100vh-4rem)] flex-col items-center justify-center px-6">
  <div class="mx-auto w-full max-w-sm">
    <div class="mb-8 flex flex-col items-center gap-3">
      <img src="svgit-logo-full.png" alt="SVG IT" class="h-10 w-auto" />
      <h1 class="text-xl font-semibold tracking-tight">Sign in to TimeSheet</h1>
    </div>

    <div class="card-padded">
      <button class="btn-secondary w-full" (click)="signInWithMicrosoft()">
        Sign in with Microsoft
      </button>

      <div class="my-6 flex items-center gap-3 text-xs text-muted-foreground">
        <div class="h-px flex-1 bg-border"></div>
        or use a local account
        <div class="h-px flex-1 bg-border"></div>
      </div>

      @if (error(); as e) {
        <div class="banner-error">{{ e }}</div>
      }

      <div class="flex flex-col gap-4">
        <label class="field">
          <span class="field-label">Email</span>
          <input type="email" class="input" [ngModel]="email()" (ngModelChange)="email.set($event)" />
        </label>
        <label class="field">
          <span class="field-label">Password</span>
          <input type="password" class="input" [ngModel]="password()" (ngModelChange)="password.set($event)" />
        </label>
        <button class="btn-primary w-full" [disabled]="working()" (click)="signInLocally()">
          Sign in
        </button>
      </div>
    </div>

    <p class="mt-6 text-center text-xs text-muted-foreground">
      First time setting this up? <a routerLink="/bootstrap-local" class="btn-link">Create the first Admin account</a>
    </p>
  </div>
</div>
