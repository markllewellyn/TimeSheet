<div class="mx-auto max-w-sm">
  <h1 class="mb-6 text-center text-xl font-semibold">Sign in to TimeSheet</h1>

  <button
    class="mb-6 w-full rounded bg-primary px-4 py-2 text-sm text-primary-foreground"
    (click)="signInWithMicrosoft()"
  >
    Sign in with Microsoft
  </button>

  <div class="mb-6 flex items-center gap-3 text-xs text-muted-foreground">
    <div class="h-px flex-1 bg-border"></div>
    or use a local account
    <div class="h-px flex-1 bg-border"></div>
  </div>

  @if (error(); as e) {
    <div class="mb-4 rounded border border-red-300 bg-red-50 px-3 py-2 text-sm text-red-700">{{ e }}</div>
  }

  <div class="flex flex-col gap-3">
    <label class="flex flex-col gap-1 text-sm">
      Email
      <input type="email" class="rounded border border-border bg-card px-3 py-2" [ngModel]="email()" (ngModelChange)="email.set($event)" />
    </label>
    <label class="flex flex-col gap-1 text-sm">
      Password
      <input type="password" class="rounded border border-border bg-card px-3 py-2" [ngModel]="password()" (ngModelChange)="password.set($event)" />
    </label>
    <button
      class="rounded border border-border px-4 py-2 text-sm disabled:opacity-60"
      [disabled]="working()"
      (click)="signInLocally()"
    >
      Sign in
    </button>
  </div>
</div>
