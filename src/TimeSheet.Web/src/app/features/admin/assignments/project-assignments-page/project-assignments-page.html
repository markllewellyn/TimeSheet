<div class="flex flex-col gap-4">
  <h1 class="page-title">Project Assignments</h1>

  @if (error(); as e) {
    <div class="banner-error">{{ e }}</div>
  }

  <div class="card overflow-hidden px-4">
    <table class="table-clean">
      <thead>
        <tr>
          <th>User</th>
          <th>Status</th>
          <th>Start</th>
          <th>End</th>
          <th>Allocated Hrs/Wk</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        @for (a of assignments(); track a.id) {
          <tr>
            <td class="font-medium text-foreground">{{ a.userDisplayName }}</td>
            <td>
              <span [class]="a.status === 'Active' ? 'badge-success' : a.status === 'Paused' ? 'badge-warning' : 'badge-neutral'">{{ a.status }}</span>
            </td>
            <td class="text-muted-foreground">{{ a.startDate }}</td>
            <td class="text-muted-foreground">{{ a.endDate ?? '-' }}</td>
            <td class="text-muted-foreground">{{ a.allocatedHoursPerWeek ?? '-' }}</td>
            <td class="text-right">
              @if (a.status !== 'Ended') {
                <button class="btn-link text-[var(--destructive)]" (click)="endAssignment(a)">End</button>
              }
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>

  <div class="card-padded grid grid-cols-4 gap-3">
    <label class="field">
      <span class="field-label">User</span>
      <select class="input" [ngModel]="newUserId()" (ngModelChange)="newUserId.set($event)">
        <option [ngValue]="null" disabled>Select a user</option>
        @for (u of users(); track u.id) {
          <option [ngValue]="u.id">{{ u.displayName }}</option>
        }
      </select>
    </label>
    <label class="field">
      <span class="field-label">Start Date</span>
      <input type="date" class="input" [ngModel]="newStartDate()" (ngModelChange)="newStartDate.set($event)" />
    </label>
    <label class="field">
      <span class="field-label">Allocated Hours/Week</span>
      <input type="number" min="0" step="0.5" class="input" [ngModel]="newAllocatedHoursPerWeek()" (ngModelChange)="newAllocatedHoursPerWeek.set($event)" />
    </label>
    <button class="btn-primary mt-6 h-fit" [disabled]="saving()" (click)="addAssignment()">{{ saving() ? 'Assigning…' : 'Assign' }}</button>
  </div>
</div>
