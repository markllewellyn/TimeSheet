<div class="flex flex-col gap-4">
  <div class="flex items-center justify-between">
    <h1 class="text-xl font-semibold">Clients</h1>
    <a routerLink="/admin/clients/new" class="rounded bg-primary px-3 py-1.5 text-sm text-primary-foreground">
      + New Client
    </a>
  </div>

  <table class="w-full border-collapse text-sm">
    <thead>
      <tr class="border-b border-border text-left">
        <th class="py-2">Name</th>
        <th class="py-2">Account Code</th>
        <th class="py-2">Reporting Currency</th>
        <th class="py-2">Status</th>
        <th class="py-2"></th>
      </tr>
    </thead>
    <tbody>
      @for (c of clients(); track c.id) {
        <tr class="border-b border-border">
          <td class="py-2">{{ c.name }}</td>
          <td class="py-2">{{ c.accountCode }}</td>
          <td class="py-2">{{ c.reportingCurrencyCode }}</td>
          <td class="py-2">{{ c.isActive ? 'Active' : 'Inactive' }}</td>
          <td class="py-2 text-right">
            <a [routerLink]="['/admin/clients', c.id]" class="mr-3 hover:underline">Edit</a>
            <a [routerLink]="['/admin/clients', c.id, 'projects']" class="mr-3 hover:underline">Projects</a>
            @if (c.isActive) {
              <button class="text-red-600 hover:underline" (click)="deactivate(c)">Deactivate</button>
            }
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
