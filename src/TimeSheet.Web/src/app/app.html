<div class="min-h-screen bg-background text-foreground">
  <header class="flex items-center justify-between border-b border-border px-6 py-3">
    <span class="font-semibold">TimeSheet</span>

    @if (currentUser.isSignedIn()) {
      <div class="flex items-center gap-3 text-sm">
        <span>{{ currentUser.me()?.displayName }}</span>
        <button class="underline" (click)="currentUser.logout()">Sign out</button>
      </div>
    } @else {
      <button class="underline text-sm" (click)="currentUser.login()">Sign in</button>
    }
  </header>

  <main class="p-6">
    <router-outlet />
  </main>
</div>
